# Next.js on Netlify (verified against docs.netlify.com, Next.js on Netlify + Frameworks overview):
# Netlify detects Next.js and applies its OpenNext adapter automatically. Server-rendered pages and the
# app/api/* route handlers run as serverless Netlify Functions. Do not pin @netlify/plugin-nextjs.
[build]
  # webpack build: Turbopack server externals use symlinks, which Windows blocks during local Netlify builds.
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Server secrets (SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) are NOT stored here. Add them in the Netlify UI:
# Project configuration → Environment variables, scope "Functions" (and "Builds"), marked "Contains secret values".

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
